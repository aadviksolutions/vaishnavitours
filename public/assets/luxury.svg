  <path d="M 28 112 L 40 88 L 78 86 L 115 46 C 128 36 150 32 180 32 L 230 32 C 255 32 272 44 286 62 L 322 80 L 340 92 C 345 98 344 110 340 116 L 298 116 C 292 98 268 98 262 116 L 115 116 C 109 98 85 98 79 116 L 24 116 C 20 116 18 112 28 112 Z" fill="url(#luxGrad)"/>
